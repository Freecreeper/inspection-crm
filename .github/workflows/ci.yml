name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# No secrets are used here — DATABASE_URL/AUTH_SECRET below are throwaway
# values for an ephemeral service container, not real credentials (PR #1
# review item 9).
env:
  DATABASE_URL: "postgresql://inspection_crm:inspection_crm_ci@localhost:5432/inspection_crm?schema=public"
  AUTH_SECRET: "ci-only-not-a-real-secret-00000000000000000000000000"
  NEXTAUTH_URL: "http://localhost:3000"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inspection_crm
          POSTGRES_PASSWORD: inspection_crm_ci
          POSTGRES_DB: inspection_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inspection_crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      # Build runs before the standalone typecheck on purpose: this app uses
      # Next's typed-route props (e.g. `LayoutProps<"/">` in
      # src/app/layout.tsx), which only resolve once `.next/types` exists —
      # and that directory is generated by `next build`/`next dev`, not by
      # `tsc` on its own. `.next/` is gitignored, so a fresh checkout has no
      # copy of it until this step creates one. `next build` also runs its
      # own full type-check, so a type error fails here first either way.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Seed (smoke test)
        run: npx prisma db seed
